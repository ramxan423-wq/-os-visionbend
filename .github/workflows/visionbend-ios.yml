name: VisionBend iOS build verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'VisionBend/**'
      - 'VisionBendTests/**'
      - 'project.yml'
      - '.github/workflows/visionbend-ios.yml'

permissions:
  contents: read

jobs:
  ios-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate iOS Xcode project
        working-directory: .
        run: xcodegen generate
      - name: Build iOS simulator app (unsigned)
        working-directory: .
        run: |
          xcodebuild -project VisionBend.xcodeproj -scheme VisionBend -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run iOS unit tests
        working-directory: .
        run: |
          xcodebuild -project VisionBend.xcodeproj -scheme VisionBend -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' CODE_SIGNING_ALLOWED=NO test
      - name: Check project structure
        run: |
          test -f VisionBend/ContentView.swift
          test -f VisionBend/BendCalculations.swift
          test -f VisionBendTests/BendCalculationsTests.swift
