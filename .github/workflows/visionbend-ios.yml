name: VisionBend iOS build verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'VisionBend/**'
      - 'VisionBendTests/**'
      - 'VisionBendWatch/**'
      - 'project.yml'
      - '.github/workflows/visionbend-ios.yml'

permissions:
  contents: read

jobs:
  ios-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate iOS Xcode project
        working-directory: .
        run: xcodegen generate
      - name: Build iOS simulator app (unsigned)
        working-directory: .
        run: |
          xcodebuild -project VisionBend.xcodeproj -scheme VisionBend -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build watchOS simulator app (unsigned)
        run: |
          xcodebuild -project VisionBend.xcodeproj -target VisionBendWatch -configuration Debug -sdk watchsimulator -destination 'generic/platform=watchOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run iOS unit tests
        working-directory: .
        run: |
          xcrun simctl list devices available
          DEVICE_ID=$(xcrun simctl list devices available | awk '/iPhone / && /[0-9A-F-]{36}/ { if (match($0, /[0-9A-F-]{36}/)) { print substr($0, RSTART, RLENGTH); exit } }')
          if [ -z "$DEVICE_ID" ]; then echo 'No iPhone simulator available'; exit 1; fi
          xcodebuild -project VisionBend.xcodeproj -scheme VisionBend -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -resultBundlePath TestResults.xcresult test
      - name: Check project structure
        run: |
          test -f VisionBend/ContentView.swift
          test -f VisionBend/BendCalculations.swift
          test -f VisionBendTests/BendCalculationsTests.swift

      - name: Upload Xcode test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VisionBend-iOS-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
