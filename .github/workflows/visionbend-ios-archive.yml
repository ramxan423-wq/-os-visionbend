name: VisionBend iOS signed archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check Apple signing secrets
        env:
          P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.VISIONBEND_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$P12" && test -n "$P12_PASSWORD" && test -n "$PROFILE" && test -n "$TEAM_ID" || {
            echo "Missing Apple signing secrets; see TESTFLIGHT.md"; exit 1;
          }
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Ensure OpenSSL 3 for PKCS#12 compatibility
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
      - name: Install signing assets
        env:
          P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.VISIONBEND_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p temp-password "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p temp-password "$KEYCHAIN"
          # The runner's /usr/bin/openssl may be LibreSSL and reject -legacy.
          OPENSSL3="$(brew --prefix openssl@3)/bin/openssl"
          # Verify the actual P12/password pair before calling macOS Keychain.
          # This avoids an ambiguous Keychain MAC verification error.
          if ! "$OPENSSL3" pkcs12 -in "$RUNNER_TEMP/certificate.p12" -info -noout -passin env:P12_PASSWORD > /dev/null 2>&1; then
            echo "::error::The P12 file and IOS_DISTRIBUTION_P12_PASSWORD do not match. Verify the exact export password and re-copy the P12 Base64."
            exit 1
          fi
          # Repackage with legacy-compatible PKCS12 encryption for macOS import.
          TEMP_PEM="$RUNNER_TEMP/signing.pem"
          trap 'rm -f "$TEMP_PEM"' EXIT
          "$OPENSSL3" pkcs12 -in "$RUNNER_TEMP/certificate.p12" -nodes -passin env:P12_PASSWORD -out "$TEMP_PEM"
          "$OPENSSL3" pkcs12 -export -legacy -in "$TEMP_PEM" -out "$RUNNER_TEMP/compatible.p12" -passout env:P12_PASSWORD
          rm -f "$TEMP_PEM"
          security import "$RUNNER_TEMP/compatible.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temp-password "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Build signed App Store archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project VisionBend.xcodeproj -scheme VisionBend -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/VisionBend.xcarchive" DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" archive
      - name: Package archive
        run: |
          cd "$RUNNER_TEMP"
          zip -qry "$GITHUB_WORKSPACE/VisionBend.xcarchive.zip" VisionBend.xcarchive
      - uses: actions/upload-artifact@v4
        with:
          name: VisionBend-signed-archive
          path: VisionBend.xcarchive.zip
          retention-days: 7
