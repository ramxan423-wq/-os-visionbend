name: VisionBend
options:
  bundleIdPrefix: com.visionbend
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
targets:
  VisionBend:
    type: application
    platform: iOS
    sources:
      - path: VisionBend
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.visionbend.conduit
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: VisionBend
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - VisionBendTests
        - VisionBendUITests
  VisionBendTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VisionBendTests
    dependencies:
      - target: VisionBend
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.visionbend.conduit.tests

  VisionBendUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VisionBendUITests
    dependencies:
      - target: VisionBend
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.visionbend.conduit.uitests
