workflows:
  visionbend-ios-check:
    name: VisionBend iOS build check
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate VisionBend app icon
        script: |
          swift tools/generate_app_icon.swift
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Build iOS Simulator app
        script: |
          xcodebuild \
            -project VisionBend.xcodeproj \
            -scheme VisionBend \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/Build/Products/Debug-iphonesimulator/VisionBend.app

  visionbend-ios-ipa:
    name: VisionBend signed iOS IPA
    integrations:
      app_store_connect: "VisionBend Codemagic"
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.visionbend.conduit
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate VisionBend app icon
        script: |
          swift tools/generate_app_icon.swift
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Increment iOS build number
        script: |
          cd "$CM_BUILD_DIR"
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"
      - name: Apply App Store signing profile
        script: |
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/VisionBend.xcodeproj" \
            --scheme VisionBend
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
